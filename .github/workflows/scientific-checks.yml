name: Finite scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      MIN_EXPECTED_PYTHON_SOURCES: '20'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded whole-run reproduction and deterministic comparison
        shell: bash
        run: |
          set -euo pipefail
          export SCIENTIFIC_OUTPUT="$RUNNER_TEMP/p051-scientific"
          mkdir -p "$SCIENTIFIC_OUTPUT"
          ulimit -v 3145728
          ulimit -t 600
          timeout --signal=TERM --kill-after=15s 600s bash -c '
            set -euo pipefail
            python -B .github/scripts/check_repository.py
            python -B reproduce.py "$SCIENTIFIC_OUTPUT/results"
            python -B compare_results.py results "$SCIENTIFIC_OUTPUT/results"
          ' 2>&1 | tee "$SCIENTIFIC_OUTPUT/run.log"
      - name: Upload raw logs and generated outputs, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p051-finite-evidence
          path: ${{ runner.temp }}/p051-scientific/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
